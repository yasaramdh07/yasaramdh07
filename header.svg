  <text x="14" y="225" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#00D4FF" opacity="0.8">// CODE . BUILD . IMPACT .</text>
  <text x="886" y="225" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#FF003C" opacity="0.8" text-anchor="end">v2.0.2026</text>

  <!-- Left square bracket -->
  <polyline points="215,72 190,72 190,158 215,158" fill="none" stroke="#FF003C" stroke-width="2.5" opacity="0.85"/>
  <!-- Right square bracket -->
