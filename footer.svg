<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="50%" style="stop-color:#09091E"/>
      <stop offset="100%" style="stop-color:#120008"/>
    </linearGradient>
  </defs>

  <rect width="900" height="110" fill="url(#bg)"/>

  <!-- Top border - gradient red to blue -->
  <rect x="0"   y="0" width="450" height="2" fill="#FF003C" opacity="0.8"/>
  <rect x="450" y="0" width="450" height="2" fill="#00D4FF" opacity="0.8"/>

  <!-- Circuit traces left -->
  <polyline points="0,30 100,30 100,70 145,70" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.5"/>
  <circle cx="145" cy="70" r="3" fill="#00D4FF" opacity="0.65"/>

  <!-- Circuit traces right -->
  <polyline points="900,30 800,30 800,70 755,70" fill="none" stroke="#FF003C" stroke-width="1.5" opacity="0.5"/>
  <circle cx="755" cy="70" r="3" fill="#FF003C" opacity="0.65"/>

  <!-- Grid dots left -->
  <circle cx="30"  cy="55" r="1" fill="#00D4FF" opacity="0.2"/>
  <circle cx="60"  cy="55" r="1" fill="#00D4FF" opacity="0.15"/>
  <circle cx="30"  cy="85" r="1" fill="#00D4FF" opacity="0.15"/>
  <circle cx="60"  cy="85" r="1" fill="#00D4FF" opacity="0.1"/>

  <!-- Grid dots right -->
  <circle cx="870" cy="55" r="1" fill="#FF003C" opacity="0.2"/>
  <circle cx="840" cy="55" r="1" fill="#FF003C" opacity="0.15"/>
  <circle cx="870" cy="85" r="1" fill="#FF003C" opacity="0.15"/>
  <circle cx="840" cy="85" r="1" fill="#FF003C" opacity="0.1"/>

  <!-- Bottom border -->
  <rect x="0" y="108" width="900" height="2" fill="#FF003C" opacity="0.6"/>
</svg>
