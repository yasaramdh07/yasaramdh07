<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#grad)" />

  <!-- Wave at bottom -->
  <path d="M0,160 C150,200 300,120 450,155 C600,190 750,130 900,160 L900,200 L0,200 Z" fill="rgba(0,0,0,0.15)" />
  <path d="M0,170 C200,210 400,140 600,170 C750,195 850,155 900,170 L900,200 L0,200 Z" fill="rgba(0,0,0,0.1)" />

  <!-- Decorative circles -->
  <circle cx="50" cy="40" r="30" fill="rgba(255,255,255,0.05)" />
  <circle cx="820" cy="30" r="50" fill="rgba(255,255,255,0.05)" />
  <circle cx="780" cy="160" r="20" fill="rgba(255,255,255,0.07)" />
  <circle cx="120" cy="160" r="15" fill="rgba(255,255,255,0.07)" />

  <!-- Main Title -->
  <text x="450" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">Ilyasa Ramadhany</text>

  <!-- Subtitle -->
  <text x="450" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.90)" text-anchor="middle" letter-spacing="0.5">💻 Web Developer  |  🌐 IoT Enthusiast  |  🚀 Tech &amp; Education Builder</text>
</svg>
