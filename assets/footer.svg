<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Wave at top -->
  <path d="M0,40 C150,0 300,80 450,45 C600,10 750,70 900,40 L900,0 L0,0 Z" fill="url(#grad)" />
  <path d="M0,30 C200,-10 400,60 600,30 C750,5 850,45 900,30 L900,0 L0,0 Z" fill="rgba(99,102,241,0.5)" />

  <!-- Background fill -->
  <rect y="40" width="900" height="80" fill="url(#grad)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="20" fill="rgba(255,255,255,0.06)" />
  <circle cx="800" cy="90" r="30" fill="rgba(255,255,255,0.06)" />
</svg>
